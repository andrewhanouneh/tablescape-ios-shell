<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Offline</title>
<script src="app-config.js"></script>
<style>
  :root { --bg: #111; --fg: #f4f1ec; --muted: rgba(244,241,236,.68); --accent: #d9c08a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: grid; place-items: center; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    -webkit-user-select: none; user-select: none;
  }
  main { max-width: 380px; }
  .mark { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 28px; display: block; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 10px; }
  p { margin: 0 0 28px; color: var(--muted); }
  button {
    appearance: none; border: 0; border-radius: 999px; padding: 14px 28px; min-width: 180px;
    font: inherit; font-weight: 600; background: var(--accent); color: var(--bg); cursor: pointer;
  }
  button:active { transform: scale(.98); }
  .status { margin-top: 18px; font-size: 14px; color: var(--muted); min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <img class="mark" src="icon.png" alt="">
  <h1 id="title">You're offline</h1>
  <p id="body">Check your connection. We'll reopen where you left off as soon as you're back online.</p>
  <button id="retry" type="button">Try again</button>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  var cfg = window.STORE_APP || {};
  var root = document.documentElement.style;
  if (cfg.background) root.setProperty('--bg', cfg.background);
  if (cfg.foreground) root.setProperty('--fg', cfg.foreground);
  if (cfg.accent) root.setProperty('--accent', cfg.accent);
  if (cfg.offline && cfg.offline.title) document.getElementById('title').textContent = cfg.offline.title;
  if (cfg.offline && cfg.offline.body) document.getElementById('body').textContent = cfg.offline.body;
  document.title = cfg.name || 'Offline';
  var status = document.getElementById('status');
  var trying = false;
  // Online but the server didn't answer is a different message from no connection at all.
  function notYet() {
    status.textContent = navigator.onLine ? 'Can’t reach ' + (cfg.name || 'the app') + ' right now. Trying again shortly.' : 'Still offline.';
    if (navigator.onLine) document.getElementById('title').textContent = 'Can’t connect';
  }
  function go() {
    if (trying || !cfg.url) return;
    trying = true;
    status.textContent = 'Connecting…';
    // A light request first, so a dead connection stays on this page instead of flashing an error.
    var done = false;
    var timer = setTimeout(function () { if (!done) { trying = false; notYet(); } }, 8000);
    fetch(cfg.url, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' }).then(function () {
      done = true; clearTimeout(timer); location.replace(cfg.url);
    }).catch(function () {
      done = true; clearTimeout(timer); trying = false; notYet();
    });
  }
  document.getElementById('retry').addEventListener('click', function () {
    try { window.Capacitor && Capacitor.Plugins.Haptics && Capacitor.Plugins.Haptics.impact({ style: 'LIGHT' }); } catch (e) {}
    go();
  });
  window.addEventListener('online', go);
  setInterval(function () { if (navigator.onLine) go(); }, 15000);
  setTimeout(go, 1500);
})();
</script>
</body>
</html>
