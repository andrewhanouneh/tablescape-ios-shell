<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Signing in · Tablescape</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 30%,#221c26,#0d0a0f);color:#f3ede5;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
.c{max-width:360px;padding:24px;text-align:center}.s{width:22px;height:22px;border:2px solid #3a3140;border-top-color:#dcc08a;border-radius:50%;animation:r .8s linear infinite;margin:0 auto 14px}
@keyframes r{to{transform:rotate(360deg)}}a{color:#dcc08a}
.b{display:inline-block;margin-top:6px;padding:12px 22px;border-radius:999px;background:#dcc08a;color:#110e13;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="c" id="c" role="status"><div class="s"></div><p>Signing you in…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
/* Where Sign in with Apple or Google comes back on the website (tablescape-studio.html, "Sign in with Apple and Google").
   It swaps the one-time code for a session with the same PKCE client that started the sign-in (storage 'ts-sso', which holds
   the code verifier, so a code stolen from the address bar is useless anywhere else), hands the session to the app's own client
   storage, keeps Apple's token so deleting the account can disconnect Apple, and goes back to the app. It only ever returns to
   this app's own page, never to an address from the link.
   Android app (?app=<its package>): Apple's page ran in a Custom Tab, and the code verifier lives in the app, not here. So this page
   swaps nothing: it hands the one-time code to that one package (an intent with package=, which no other app can receive), and the
   app swaps it (tablescape-studio.html, tsSsoFinish). Only our own two package names are accepted. */
(async () => {
  const C = {"url":"https://api.tablescape.vip","key":"sb_publishable_f7X_BpBscyPrSviTMvZUEi_awXThv16"}, q = new URLSearchParams(location.search), box = document.getElementById('c');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
  const forget = () => { try { Object.keys(localStorage).filter(k => k === 'ts-sso' || k.startsWith('ts-sso-')).forEach(k => localStorage.removeItem(k)); } catch(e){} };
  const via = (() => { try { const v = sessionStorage.getItem('ts-sso'); sessionStorage.removeItem('ts-sso'); return v; } catch(e){ return null; } })();
  const fail = m => { forget(); box.innerHTML = `<p>${esc(m)}</p><p><a href="./">Back to Tablescape</a></p>`; };
  history.replaceState(null, '', location.pathname);   /* the code leaves the address bar and the history */
  const pkg = q.get('app');
  if(pkg !== null){
    if(!/^com\.tablescapestudio\.app(\.test)?$/.test(pkg)) return fail('This sign-in link isn’t for Tablescape.');
    const pass = new URLSearchParams(); for(const k of ['code', 'error', 'error_description']) if(q.get(k)) pass.set(k, q.get(k));
    const to = `intent://sso?${pass}#Intent;scheme=${pkg};package=${pkg};end`;
    box.innerHTML = `<p>${q.get('code') ? 'Apple confirmed it’s you. Return to Tablescape to finish signing in.' : 'Sign-in didn’t finish. Return to Tablescape to try again.'}</p><p><a class="b" id="go">Open Tablescape</a></p>`;
    document.getElementById('go').href = to;
    location.href = to;   /* Chrome may wait for a tap; the button is there for that */
    return;
  }
  try {
    if(!window.supabase) return fail('Can’t reach the sign-in service. Check your connection and try again.');
    const err = q.get('error_description') || q.get('error'); if(err) return fail(/cancel|denied/i.test(err) ? 'Sign-in was cancelled.' : 'Sign-in didn’t finish: ' + err);
    const code = q.get('code'); if(!code) return fail('This sign-in has expired. Start again from Tablescape.');
    const pk = supabase.createClient(C.url, C.key, {auth:{flowType:'pkce', storageKey:'ts-sso', persistSession:true, autoRefreshToken:false, detectSessionInUrl:false}});
    const {data, error} = await pk.auth.exchangeCodeForSession(code); forget();
    if(error || !data || !data.session) return fail('That sign-in didn’t work' + (error && error.message ? ': ' + error.message : '') + '. Start again from Tablescape on this same browser.');
    const s = data.session, app = supabase.createClient(C.url, C.key, {auth:{persistSession:true, autoRefreshToken:false, detectSessionInUrl:false}});
    const set = await app.auth.setSession({access_token:s.access_token, refresh_token:s.refresh_token}); if(set.error) return fail('That sign-in didn’t work: ' + set.error.message);
    if(via === 'apple' && s.provider_refresh_token){
      await fetch(String(C.url).replace(/\/$/, '') + '/functions/v1/sso-account', {method:'POST', headers:{'Content-Type':'application/json', apikey:C.key, Authorization:'Bearer ' + s.access_token},
        body:JSON.stringify({action:'apple-save', via:'web', refresh_token:s.provider_refresh_token})}).catch(() => {});
    }
    location.replace('./');
  } catch(e){ fail('That sign-in didn’t work. Start again from Tablescape.'); }
})();
</script>
</body>
</html>
